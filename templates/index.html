<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Drive Server</title>
  <style>
    body {
      font-family: 'Fira Mono', monospace;
      margin: 2em;
      background: #f5f7fa;
      color: #23272a;
    }

    h1 {
      color: #1976d2;
      text-align: center;
    }

    .logout-btn {
      position: fixed;
      top: 1.5em;
      right: 2em;
      background: #d32f2f;
      color: white;
      border: none;
      padding: 0.4em 1.4em;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #b71c1c;
    }

    .back-btn {
      margin-bottom: 10px;
      background: #1976d2;
      color: white;
      border: none;
      padding: 0.4em 1.4em;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .back-btn:hover {
      background: #1251a3;
    }

    .table-container {
      background: white;
      border-radius: 14px;
      padding: 1em;
      box-shadow: 0 2px 16px #0002;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 1em;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      color: #1976d2;
    }

    a.item-link {
      cursor: pointer;
      text-decoration: none;
      color: #23272a;
    }

    a.item-link:hover {
      color: #1976d2;
      text-decoration: underline;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .viewBtn,
    .downloadBtn {
      background: #1976d2;
      border: none;
      color: white;
      padding: 6px 14px;
      margin: 0 4px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s ease;
    }

    .viewBtn:hover,
    .downloadBtn:hover {
      background: #1251a3;
    }


    .preview {
      margin: 30px auto;
      padding: 1em;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: white;
      max-width: 90%;
      max-height: 600px;
      overflow: auto;
      display: none;
    }
  </style>
</head>

<body>
  <button class="logout-btn" id="logoutBtn">Logout</button>
  <button class="back-btn" id="backBtn">Back</button>
  <h1>Local Drive Server</h1>
  <div>Current Path: <span id="currentPath">/</span></div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Size</th>
          <th>Last Modified</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="fileList"></tbody>
    </table>
  </div>
  <div class="preview" id="previewArea" style="display:none;"></div>

  <script>
    const logoutBtn = document.getElementById('logoutBtn');
    const backBtn = document.getElementById('backBtn');
    const currentPathSpan = document.getElementById('currentPath');
    const fileList = document.getElementById('fileList');
    const previewArea = document.getElementById('previewArea');

    let currentPath = '';

    logoutBtn.onclick = () => window.location.href = '/logout';
    backBtn.onclick = () => goBack();

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function updatePath(path) {
      currentPath = path;
      currentPathSpan.textContent = path || '/';
      backBtn.style.display = (path && path !== '') ? 'inline-block' : 'none';
    }

    function fetchList(path) {
      let apiPath = '/api/list/';
      if (path) apiPath += encodeURIComponent(path);
      fetch(apiPath)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            fileList.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">${data.error}</td></tr>`;
            previewArea.style.display = 'none';
            return;
          }
          renderList(data);
          previewArea.style.display = 'none';
        })
        .catch(() => {
          fileList.innerHTML = `<tr><td colspan="5" style="color:red; text-align:center;">Failed to load directory</td></tr>`;
          previewArea.style.display = 'none';
        });
    }

    function renderList(data) {
      fileList.innerHTML = '';
      if (data.folders.length === 0 && data.files.length === 0) {
        fileList.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#888;">Empty directory</td></tr>`;
        return;
      }

      data.folders.forEach(folder => {
        const row = document.createElement('tr');
        row.innerHTML = `
                    <td><a href="#" class="item-link" data-type="folder" data-name="${folder}">${folder}</a></td>
                    <td>Folder</td><td></td><td></td><td></td>
                `;
        fileList.appendChild(row);
      });

      data.files.forEach(file => {
        const lastMod = new Date(file.mtime * 1000).toLocaleString();
        const row = document.createElement('tr');
        row.innerHTML = `
                    <td><a href="#" class="item-link" data-type="file" data-name="${file.name}">${file.name}</a></td>
                    <td>File</td>
                    <td>${formatBytes(file.size)}</td>
                    <td>${lastMod}</td>
                    <td>
                      <div style="display:flex; gap:6px;">
                        <button data-name="${file.name}" class="viewBtn">View</button>
                        <a href="/api/view/${encodeURIComponent(currentPath + '/' + file.name)}" target="_blank" class="downloadBtn">Download</a>
                      </div>
                    </td>

                `;
        fileList.appendChild(row);
      });

      fileList.querySelectorAll('.item-link').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const type = link.dataset.type;
          const name = link.dataset.name;
          const newPath = currentPath ? (currentPath + '/' + name) : name;
          if (type === 'folder') {
            loadPath(newPath);
          } else if (type === 'file') {
            previewFile(newPath);
          }
        });
      });

      fileList.querySelectorAll('.viewBtn').forEach(btn => {
        btn.addEventListener('click', () => {
          const name = btn.dataset.name;
          previewFile(currentPath ? (currentPath + '/' + name) : name);
        });
      });
    }
    function previewFile(filepath) {
      const ext = filepath.split('.').pop().toLowerCase();
      previewArea.style.display = "block";  // show it
      previewArea.innerHTML = 'Loading preview...';

      const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'];
      const audioExts = ['mp3', 'wav', 'ogg'];
      const videoExts = ['mp4', 'webm', 'ogg', 'mkv', 'avi', 'mov'];
      const textExts = ['txt', 'log', 'md', 'json', 'js', 'css', 'html', 'py', 'java', 'c', 'cpp'];

      const streamUrl = '/api/stream/' + encodeURIComponent(filepath);
      const viewUrl = '/api/view/' + encodeURIComponent(filepath);

      if (imageExts.includes(ext)) {
        previewArea.innerHTML = `<img src="${viewUrl}" style="max-width:100%; max-height:500px; display:block; margin: 0 auto;" alt="${filepath}" />`;
      } else if (audioExts.includes(ext)) {
        previewArea.innerHTML = `<audio controls style="width:100%;"><source src="${viewUrl}" type="audio/${ext}"></audio>`;
      } else if (videoExts.includes(ext)) {
        previewArea.innerHTML = `
            <video controls style="width:100%; max-height:600px; display:block; margin: 0 auto;">
                <source src="${streamUrl}" type="video/${ext === 'mkv' ? 'mp4' : ext}">
                Your browser does not support the video tag.
            </video>
        `;
      } else if (textExts.includes(ext)) {
        fetch(viewUrl)
          .then(r => r.text())
          .then(text => {
            previewArea.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
          })
          .catch(() => {
            previewArea.innerHTML = 'Failed to load file preview.';
          });
      } else {
        previewArea.innerHTML = `<a href="${viewUrl}" download>Download ${filepath}</a>`;
      }
    }


    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function goBack() {
      if (!currentPath) return;
      const parts = currentPath.split('/');
      parts.pop();
      const newPath = parts.join('/');
      loadPath(newPath);
    }

    function loadPath(path) {
      updatePath(path);
      history.pushState({ path }, '', '/?path=' + encodeURIComponent(path));
      fetchList(path);
    }

    window.onpopstate = (event) => {
      const path = event.state ? event.state.path : '';
      loadPath(path);
    };

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pathParam = urlParams.get('path') || '';
      loadPath(pathParam);
    };
  </script>
</body>

</html>
