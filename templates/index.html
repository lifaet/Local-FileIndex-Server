<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Local Drive Server</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: monospace; margin: 2em; background: #f5f7fa; color: #23272a; }
    .logout-btn { position: fixed; top: 1.5em; right: 2em; background: #d32f2f; color: white; border: none; padding: 0.4em 1.4em; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .logout-btn:hover { background: #b71c1c; }
    .back-btn { margin-bottom: 10px; background: #1976d2; color: white; border: none; padding: 0.4em 1.4em; border-radius: 6px; font-weight: 600; cursor: pointer; display: none; }
    .back-btn:hover { background: #1251a3; }
    .table-container { background: white; border-radius: 14px; padding: 1em; box-shadow: 0 2px 16px #0002; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 1em; border-bottom: 1px solid #eee; text-align: left; }
    th { color: #1976d2; font-weight: bold; }
    .name-link { cursor: pointer; color: #1976d2; text-decoration: none; }
    .name-link:hover { text-decoration: underline; }
    .btn { background: #1976d2; color: white; border: none; padding: 0.4em 1em; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn:hover { background: #1251a3; }
    .preview { margin: 30px auto; padding: 2em; border: 1px solid #ddd; border-radius: 14px; background: white; max-width: 95%; max-height: 70vh; overflow: auto; display: none; text-align: center; }
    .preview img, .preview video, .preview audio { max-width: 100%; max-height: 100%; }
    .preview pre { max-width: 100%; overflow: auto; text-align: left; }
  </style>
</head>
<body>
  <button class="logout-btn" id="logoutBtn">Logout</button>
  <button class="back-btn" id="backBtn">Back</button>
  <div>Current Path: <span id="currentPath">/</span></div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Size</th>
          <th>Last Modified</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="fileList"></tbody>
    </table>
  </div>
  <div class="preview" id="previewArea"></div>
  
  <!-- Video Player Popup -->
  <div id="videoPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; padding:20px;">
    <div style="position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
      <button onclick="closeVideoPopup()" style="position:absolute; top:20px; right:20px; background:#d32f2f; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-size:16px; z-index:10000;">✕ Close</button>
      <video id="videoPlayer" controls style="max-width:95%; max-height:95%; background:#000;">
        <source id="videoSource" src="" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <script>
    const INITIAL_DATA = {{ initial_data | tojson | safe }};
    let currentPath = '/';

    document.getElementById('logoutBtn').onclick = () => location.href = '/logout';
    document.getElementById('backBtn').onclick = () => goBack();

    const fileList = document.getElementById('fileList');
    fileList.addEventListener('click', (e) => {
      const folderLink = e.target.closest('[data-folder]');
      const fileLink = e.target.closest('[data-file]');
      const viewBtn = e.target.closest('[data-view-file]');
      
      if (folderLink) {
        e.preventDefault();
        const folder = folderLink.dataset.folder;
        const newPath = currentPath === '/' ? folder : currentPath + '/' + folder;
        loadPath(newPath);
      } else if (fileLink) {
        e.preventDefault();
        const filename = fileLink.dataset.file;
        const filepath = currentPath === '/' ? filename : currentPath + '/' + filename;
        previewFile(filepath);
      } else if (viewBtn) {
        e.preventDefault();
        const filename = viewBtn.dataset.viewFile;
        const filepath = currentPath === '/' ? filename : currentPath + '/' + filename;
        previewFile(filepath);
      }
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function renderList(data) {
      fileList.innerHTML = '';
      currentPath = data.current_path;
      document.getElementById('currentPath').textContent = currentPath;
      document.getElementById('backBtn').style.display = currentPath && currentPath !== '/' ? 'inline-block' : 'none';

      data.folders.forEach(folder => {
        const row = fileList.insertRow();
        row.innerHTML = `<td><a href="#" class="name-link" data-folder="${folder}">${folder}</a></td><td>Folder</td><td></td><td></td><td></td>`;
      });

      data.files.forEach(file => {
        const row = fileList.insertRow();
        const mtime = new Date(file.mtime * 1000).toLocaleString();
        const downloadPath = encodeURIComponent(currentPath === '/' ? file.name : currentPath + '/' + file.name);
        row.innerHTML = `<td><a href="#" class="name-link" data-file="${file.name}">${file.name}</a></td><td>File</td><td>${formatBytes(file.size)}</td><td>${mtime}</td><td><a href="/api/view/?path=${downloadPath}" class="btn">Download</a> <a href="#" class="btn" data-view-file="${file.name}">Preview</a></td>`;
      });
    }

    function previewFile(filepath) {
      const ext = filepath.split('.').pop().toLowerCase();
      const preview = document.getElementById('previewArea');
      const dlPath = encodeURIComponent(filepath);
      
      preview.style.display = 'block';
      
      const imageExts = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'webp'];
      const videoExts = ['mp4', 'webm', 'mkv', 'avi', 'mov', 'flv', 'm4v', 'mts', 'ts'];
      const audioExts = ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'];
      const textExts = ['txt', 'log', 'md', 'json', 'js', 'css', 'html', 'py', 'java', 'c', 'cpp', 'sh', 'bash', 'xml', 'yaml', 'yml'];
      const pdfExts = ['pdf'];
      
      if (imageExts.includes(ext)) {
        preview.innerHTML = `<img src="/api/view/?path=${dlPath}" style="max-height: 70vh; margin: auto; display: block;" />`;
      } else if (videoExts.includes(ext)) {
        openVideoPopup(`/api/stream/?path=${dlPath}`, filepath);
      } else if (audioExts.includes(ext)) {
        preview.innerHTML = `<p>Audio File</p><audio controls style="width: 100%; margin: 20px auto; display: block;"><source src="/api/view/?path=${dlPath}" type="audio/${ext}">Your browser does not support audio.</audio><p><a href="/api/view/?path=${dlPath}" class="btn" download>Download</a></p>`;
      } else if (pdfExts.includes(ext)) {
        preview.innerHTML = `<iframe src="/api/view/?path=${dlPath}" style="width: 100%; height: 70vh; border: none;"></iframe>`;
      } else if (textExts.includes(ext)) {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', `/api/view/?path=${dlPath}`, true);
        xhr.onload = () => {
          if (xhr.status === 200) {
            const text = xhr.responseText.substring(0, 100000);
            const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            preview.innerHTML = `<pre>${escaped}</pre>`;
          } else {
            preview.innerHTML = '<p style="color:red;">Could not load preview</p>';
          }
        };
        xhr.onerror = () => preview.innerHTML = '<p style="color:red;">Error loading file</p>';
        xhr.send();
      } else {
        preview.innerHTML = `<p>No preview available for this file type</p><a href="/api/view/?path=${dlPath}" class="btn" download>Download ${filepath}</a>`;
      }
    }

    function openVideoPopup(src, filename) {
      document.getElementById('videoPopup').style.display = 'block';
      document.getElementById('videoSource').src = src;
      document.getElementById('videoPlayer').load();
      document.getElementById('videoPlayer').focus();
    }

    function closeVideoPopup() {
      const video = document.getElementById('videoPlayer');
      video.pause();
      video.src = '';
      document.getElementById('videoPopup').style.display = 'none';
    }

    function loadPath(path) {
      const url = path === '/' ? '/api/list/' : '/api/list/?path=' + encodeURIComponent(path);
      fetch(url, { credentials: 'same-origin' })
        .then(r => r.json())
        .then(data => renderList(data))
        .catch(err => {
          fileList.innerHTML = '<tr><td colspan="5" style="color:red;">Error loading directory</td></tr>';
        });
    }

    function goBack() {
      const parts = currentPath.split('/').filter(x => x);
      parts.pop();
      loadPath(parts.length ? '/' + parts.join('/') : '/');
    }

    window.onload = () => renderList(INITIAL_DATA);
  </script>
</body>
</html>
